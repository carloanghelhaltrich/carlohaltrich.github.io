<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content</title>
<style>
  /* ---------- SETTINGS: edit these ---------- */
  :root {
    --block-h: 95vh;          /* height of every block; under 100vh so neighbours peek in */
    --collage-h: 170vh;       /* height of the photo collage block */
    --phones-bg: #1d2333;     /* background of the phone block */
    --phone-gap: 4vw;         /* space between the phones */
    --video-dim: 0.2;         /* video dimming: 0 = none, higher = darker (same as the landing page) */
  }
  /* ------------------------------------------ */

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #111; }
  body { background: #111; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

  .block { position: relative; display: block; width: 100%; height: var(--block-h); overflow: hidden; background: #1a1a1a; }
  video, .collage img { display: block; width: 100%; height: 100%; object-fit: cover; background: #1a1a1a; }

  /* Dimming layer over every video (same method as the landing page) */
  .split > div, .slide, .phone { position: relative; }
  .split > div::after, .slide::after, .phone::after, .single::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(0, 0, 0, var(--video-dim));
  }

  /* Overlaid text buttons + video lightbox */
  .vid-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
    padding: 1rem 2.25rem; border: 2px solid #fff; background: transparent; color: #fff;
    font: inherit; font-size: 1.5rem; letter-spacing: 0.04em; white-space: nowrap; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .vid-btn:hover, .vid-btn:focus-visible { background: #fff; color: #111; outline: none; }

  .lightbox { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); }
  .lightbox[hidden] { display: none; }
  .lb-frame { position: relative; width: min(90vw, calc(85vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; }
  .lb-frame iframe { width: 100%; height: 100%; border: 0; }
  .lightbox:focus { outline: none; }

  /* Custom controls (shown for YouTube links; the shield stops YouTube's own overlays from appearing on hover) */
  .lb-shield { position: absolute; inset: 0; z-index: 1; display: none; cursor: pointer; }
  .lb-controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: none; align-items: center; gap: 0.9rem;
    padding: 2.5rem 1.1rem 0.9rem; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); color: #fff; font-size: 0.85rem;
  }
  .lightbox.custom .lb-shield { display: block; }
  .lightbox.custom .lb-controls { display: flex; }
  .lb-controls button { display: flex; padding: 0.25rem; border: 0; background: none; color: #fff; cursor: pointer; }
  .lb-controls button:hover { opacity: 0.75; }
  .lb-controls svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .lb-controls span { font-variant-numeric: tabular-nums; }
  .lb-seek { flex: 1; height: 0.3rem; accent-color: #fff; cursor: pointer; }
  .lb-msg { opacity: 0.85; }
  .lb-close { position: absolute; top: 1rem; right: 1.75rem; border: 0; background: none; color: #fff; font-size: 2.75rem; line-height: 1; cursor: pointer; }
  .lb-close:hover { opacity: 0.7; }

  /* Block type: split (two videos side by side) */
  .split { display: flex; }
  .split > div { flex: 1 1 50%; height: 100%; }

  /* Block type: slideshow */
  .track { display: flex; height: 100%; transition: transform 0.5s ease; }
  .slide { flex: 0 0 100%; height: 100%; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 3.25rem; height: 3.25rem; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0, 0, 0, 0.35); color: #fff;
    font-size: 1.75rem; line-height: 1; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .arrow:hover, .arrow:focus-visible { background: #fff; color: #111; outline: none; }
  .arrow.prev { left: 1.5rem; }
  .arrow.next { right: 1.5rem; }

  /* Block type: three phones */
  .phones { display: flex; align-items: center; justify-content: center; gap: var(--phone-gap); background: var(--phones-bg); }
  .phone {
    --phone-h: calc(var(--block-h) * 0.78);   /* total phone height */
    --phone-b: 0.7rem;                        /* bezel thickness */
    position: relative; height: var(--phone-h);
    width: calc((var(--phone-h) - 2 * var(--phone-b)) / 1.99 + 2 * var(--phone-b));  /* screen = 9:16 video + bottom bar */
    border: var(--phone-b) solid #08090c; border-radius: 2.6rem; overflow: hidden;
    background: #08090c; box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.45);
    container-type: inline-size;   /* bar text scales with the phone size */
    display: flex; flex-direction: column;   /* top bar, video, bottom bar */
  }
  .phone::before {   /* notch */
    content: ""; position: absolute; top: 0.55rem; left: 50%; transform: translateX(-50%);
    width: 28%; height: 1.1rem; border-radius: 1rem; background: #08090c; z-index: 3;
  }

  /* TikTok-style: video is exactly 9:16, status bar and tabs sit on top of it, nav bar fills the rest */
  .phone video { flex: none; width: 100%; height: auto; aspect-ratio: 9 / 16; }
  .ui-top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; color: #fff; font-weight: 600; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55); background: linear-gradient(rgba(0, 0, 0, 0.35), transparent); padding-bottom: 6cqw; pointer-events: none; }
  .status { height: 8.5cqw; display: flex; justify-content: space-between; align-items: center; padding: 0 8cqw; font-size: 0.75rem; font-size: 3.8cqw; }
  .status .right { display: flex; align-items: center; gap: 1.6cqw; }
  .batt { position: relative; width: 6.6cqw; height: 3cqw; border: 0.35cqw solid rgba(255, 255, 255, 0.7); border-radius: 0.9cqw; }
  .batt::after { content: ""; position: absolute; inset: 0.35cqw; border-radius: 0.4cqw; background: #fff; }
  .tabs { height: 10cqw; display: flex; justify-content: center; align-items: center; gap: 6cqw; font-size: 1rem; font-size: 5.2cqw; color: rgba(255, 255, 255, 0.65); }
  .tabs .on { color: #fff; border-bottom: 0.5cqw solid #fff; padding: 0.6cqw 0; }

  .ui-nav { position: relative; z-index: 2; flex: 1; background: #0d0e12; color: #fff; font-weight: 600; }
  .ui-nav::after { content: ""; position: absolute; bottom: 2.5cqw; left: 50%; transform: translateX(-50%); width: 34%; height: 1.2cqw; border-radius: 1cqw; background: rgba(255, 255, 255, 0.9); }  /* home indicator */
  .ui-nav .row { height: 13.5cqw; display: flex; justify-content: space-between; align-items: center; padding: 0 5cqw; font-size: 0.85rem; font-size: 4.3cqw; color: rgba(255, 255, 255, 0.6); }
  .ui-nav .row .on { color: #fff; }
  .ui-nav .plus { width: 11.5cqw; height: 7.6cqw; border-radius: 2cqw; background: #fff; box-shadow: -1cqw 0 #25f4ee, 1cqw 0 #fe2c55; }

  /* Block type: photo collage (6 x 6 grid, no gaps) */
  .collage { height: var(--collage-h); display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); }
  .collage img:nth-child(1) { grid-area: 1 / 1 / 4 / 4; }
  .collage img:nth-child(2) { grid-area: 1 / 4 / 3 / 7; }
  .collage img:nth-child(3) { grid-area: 3 / 4 / 5 / 6; }
  .collage img:nth-child(4) { grid-area: 3 / 6 / 7 / 7; }
  .collage img:nth-child(5) { grid-area: 4 / 1 / 7 / 3; }
  .collage img:nth-child(6) { grid-area: 4 / 3 / 7 / 4; }
  .collage img:nth-child(7) { grid-area: 5 / 4 / 7 / 6; }
</style>
</head>
<body>

  <!-- 1. Split block -->
  <section class="block split">

    <div class="phone">
      <div class="ui-top">
        <div class="status"><span>9:41</span><span class="right"><span>5G</span><i class="batt"></i></span></div>
        <div class="tabs"><span>Following</span><span class="on">For You</span></div>
      </div>
      <video muted loop playsinline preload="metadata" src="videos/content/b3-2.mp4"></video>
      <nav class="ui-nav"><div class="row"><span class="on">Home</span><span>Friends</span><span class="plus"></span><span>Inbox</span><span>Profile</span></div></nav>
    </div>
    <div class="phone">
      <div class="ui-top">
        <div class="status"><span>9:41</span><span class="right"><span>5G</span><i class="batt"></i></span></div>
        <div class="tabs"><span>Following</span><span class="on">For You</span></div>
      </div>

  <!-- 4. Slideshow block -->
  <section class="block slider">
    <div class="track">
      <div class="slide"><video muted loop playsinline preload="metadata" src="videos/content/b4-1.mp4"></video></div>
      <div class="slide"><video muted loop playsinline preload="metadata" src="videos/content/b4-2.mp4"></video></div>
      <div class="slide"><video muted loop playsinline preload="metadata" src="videos/content/b4-3.mp4"></video></div>
    </div>

  <!-- 5. Single video block -->
  <section class="block single">
    <video muted loop playsinline preload="metadata" src="videos/content/b5.mp4"></video>

  <!-- 6. Photo collage block (7 photos, fills the grid exactly) -->
  <section class="block collage">
    <img src="photos/p1.jpg" alt="">
    <img src="photos/p2.jpg" alt="">
    <img src="photos/p3.jpg" alt="">
    <img src="photos/p4.jpg" alt="">
    <img src="photos/p5.jpg" alt="">
    <img src="photos/p6.jpg" alt="">
    <img src="photos/p7.jpg" alt="">
  </section>

  <!-- 7. Single video block -->
  <section class="block single">
    <video muted loop playsinline preload="metadata" src="videos/content/b7.mp4"></video>
  </section>

  <!-- Video lightbox (shared by every .vid-btn) -->
  <div class="lightbox" id="lightbox" tabindex="-1" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <div class="lb-frame">
      <div id="yt-slot"></div>
      <div class="lb-shield"></div>
      <div class="lb-controls">
        <button class="lb-play" aria-label="Play or pause"></button>
        <span class="lb-cur">0:00</span>
        <input class="lb-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        <span class="lb-dur">0:00</span>
        <button class="lb-mute" aria-label="Mute or unmute"></button>
        <span class="lb-msg"></span>
        <button class="lb-share" aria-label="Copy link"></button>
      </div>
    </div>
  </div>

  <script src="site.js"></script>
  <script>
    const videos = document.querySelectorAll('video');

    // A video plays only while on screen (and, in a slideshow, only when its slide is showing)
    function update(v) {
      const slide = v.closest('.slide');
      const ok = v.dataset.vis === '1' && (!slide || slide.classList.contains('active'));
      if (ok) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else v.pause();
    }

    const io = new IntersectionObserver(entries => {
      entries.forEach(e => { e.target.dataset.vis = e.isIntersecting ? '1' : '0'; update(e.target); });
    }, { threshold: 0.3 });
    videos.forEach(v => { v.muted = true; io.observe(v); });

    // Slideshows
    document.querySelectorAll('.slider').forEach(s => {
      const track = s.querySelector('.track');
      const slides = [...s.querySelectorAll('.slide')];
      let i = 0;
      function show(n) {
        i = (n + slides.length) % slides.length;
        slides.forEach((el, k) => el.classList.toggle('active', k === i));
        track.style.transform = 'translateX(' + (-100 * i) + '%)';
        slides.forEach(el => update(el.querySelector('video')));
      }
      s.querySelector('.prev').addEventListener('click', () => show(i - 1));
      s.querySelector('.next').addEventListener('click', () => show(i + 1));
      show(0);
    });

    // If a browser (e.g. Safari) blocks autoplay, the first click or key press starts everything
    ['pointerdown', 'keydown', 'touchstart'].forEach(evt =>
      document.addEventListener(evt, () => videos.forEach(update), { once: true, passive: true })
    );

    // Lightbox: YouTube links get custom controls (play/pause, seek bar, mute, share); other links (e.g. Vimeo) use their own player
    const lb = document.getElementById('lightbox');
    const frameBox = lb.querySelector('.lb-frame');
    const el = {
      play: lb.querySelector('.lb-play'), seek: lb.querySelector('.lb-seek'),
      cur: lb.querySelector('.lb-cur'), dur: lb.querySelector('.lb-dur'),
      mute: lb.querySelector('.lb-mute'), share: lb.querySelector('.lb-share'),
      msg: lb.querySelector('.lb-msg'), shield: lb.querySelector('.lb-shield')
    };
    const ICON = {
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
      vol: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
      muted: '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
      share: '<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>'
    };

    let player = null, ready = false, timer = null, apiPromise = null, shareLink = '', msgTimer = null;

    function parseYouTube(link) {
      try {
        const u = new URL(link), h = u.hostname.replace('www.', '');
        if (h === 'youtu.be') return u.pathname.slice(1) || null;
        if (h.endsWith('youtube.com')) {
          const p = u.pathname.split('/');
          return (p[1] === 'embed' || p[1] === 'shorts') ? (p[2] || null) : u.searchParams.get('v');
        }
      } catch (e) {}
      return null;
    }

    function toEmbed(link) {   // Vimeo falls back to its own player; anything else is embedded as given
      try {
        const u = new URL(link);
        if (u.hostname.replace('www.', '').endsWith('vimeo.com')) {
          const m = u.pathname.match(/(\d+)(?:\/(\w+))?/);
          if (m) return 'https://player.vimeo.com/video/' + m[1] + '?autoplay=1' + (m[2] ? '&h=' + m[2] : '');
        }
      } catch (e) {}
      return link;
    }

    function loadApi() {
      if (apiPromise) return apiPromise;
      apiPromise = new Promise(resolve => {
        if (window.YT && YT.Player) return resolve();
        window.onYouTubeIframeAPIReady = resolve;
        const t = document.createElement('script');
        t.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(t);
      });
      return apiPromise;
    }

    const fmt = t => { t = Math.floor(t || 0); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

    function tick() {
      if (!player || !ready) return;
      const d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
      el.seek.max = d; el.seek.value = c;
      el.cur.textContent = fmt(c); el.dur.textContent = fmt(d);
    }
    function syncIcons() {
      const playing = ready && player.getPlayerState() === 1;
      el.play.innerHTML = playing ? ICON.pause : ICON.play;
      el.mute.innerHTML = (ready && player.isMuted()) ? ICON.muted : ICON.vol;
    }
    function togglePlay() {
      if (!ready) return;
      if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
    }
    function toggleMute() {
      if (!ready) return;
      if (player.isMuted()) player.unMute(); else player.mute();
      syncIcons();
    }
    function flash(text) {
      el.msg.textContent = text;
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => { el.msg.textContent = ''; }, 1800);
    }

    async function openLightbox(link) {
      const id = parseYouTube(link);
      lb.hidden = false;
      document.body.style.overflow = 'hidden';
      lb.focus();

      frameBox.querySelectorAll('#yt-slot, iframe').forEach(n => n.remove());
      const slot = document.createElement('div');
      slot.id = 'yt-slot';
      frameBox.prepend(slot);

      if (!id) {   // not YouTube: use the host's own player and controls
        lb.classList.remove('custom');
        const f = document.createElement('iframe');
        f.allow = 'autoplay; fullscreen; picture-in-picture';
        f.allowFullscreen = true;
        f.src = toEmbed(link);
        slot.appendChild(f);
        return;
      }

      lb.classList.add('custom');
      shareLink = 'https://youtu.be/' + id;
      ready = false;
      el.seek.value = 0; el.cur.textContent = '0:00'; el.dur.textContent = '0:00';
      syncIcons();

      await loadApi();
      if (lb.hidden) return;   // closed while the API was loading
      player = new YT.Player('yt-slot', {
        videoId: id,
        playerVars: { autoplay: 1, controls: 0, rel: 0, iv_load_policy: 3, playsinline: 1, disablekb: 1, fs: 0, enablejsapi: 1 },
        events: {
          onReady: e => { ready = true; e.target.playVideo(); syncIcons(); tick(); },
          onStateChange: () => { syncIcons(); tick(); }
        }
      });
      timer = setInterval(tick, 250);
    }

    function closeLightbox() {
      lb.hidden = true;
      clearInterval(timer);
      ready = false;
      if (player) { try { player.destroy(); } catch (e) {} player = null; }
      frameBox.querySelectorAll('#yt-slot, iframe').forEach(n => n.remove());
      lb.classList.remove('custom');
      document.body.style.overflow = '';
    }

    el.share.innerHTML = ICON.share;
    syncIcons();
    el.play.addEventListener('click', togglePlay);
    el.shield.addEventListener('click', togglePlay);
    el.mute.addEventListener('click', toggleMute);
    el.seek.addEventListener('input', () => {
      if (!ready) return;
      player.seekTo(parseFloat(el.seek.value), true);
      el.cur.textContent = fmt(el.seek.value);
    });
    el.share.addEventListener('click', () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLink).then(() => flash('Link copied'), () => window.prompt('Copy this link', shareLink));
      } else window.prompt('Copy this link', shareLink);
    });

    document.querySelectorAll('.vid-btn').forEach(b =>
      b.addEventListener('click', () => openLightbox(b.dataset.video)));
    lb.querySelector('.lb-close').addEventListener('click', closeLightbox);
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
    document.addEventListener('keydown', e => {
      if (lb.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      else if (lb.classList.contains('custom') && !['BUTTON', 'INPUT'].includes(document.activeElement.tagName)) {
        if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        else if (e.key === 'm' || e.key === 'M') toggleMute();
      }
    });
  </script>
</body>
</html>
