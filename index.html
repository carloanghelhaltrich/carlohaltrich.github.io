<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
  /* ---------- SETTINGS: edit these ---------- */
  :root {
    --video-brightness: 0.8;   /* 1 = original, lower = darker */
    --button-font-size: 1.5rem;
    --button-color: #ffffff;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  /* ------------------------------------------ */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: var(--font);
  }

  .split {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  .half {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
    background: #1a1a1a; /* shows until a video loads */
  }

  .half video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;               /* crops to fill the whole half */
    filter: brightness(var(--video-brightness));
  }

  .half a {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 1rem 2.25rem;
    border: 2px solid var(--button-color);
    color: var(--button-color);
    font-size: var(--button-font-size);
    letter-spacing: 0.04em;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .half a:hover,
  .half a:focus-visible {
    background: var(--button-color);
    color: #111;
    outline: none;
  }

  .half a:focus-visible {
    outline: 3px solid var(--button-color);
    outline-offset: 4px;
  }
</style>
</head>
<body>
  <main class="split">

    <!-- LEFT HALF -->
    <section class="half">
      <video autoplay muted loop playsinline preload="auto">
        <source src="videos/left.mp4" type="video/mp4">
      </video>
      <a href="shorts-music-videos.html">shorts &amp; music videos</a>
    </section>

    <!-- RIGHT HALF -->
    <section class="half">
      <video autoplay muted loop playsinline preload="auto">
        <source src="videos/right.mp4" type="video/mp4">
      </video>
      <a href="content.html">content</a>
    </section>

  </main>
</body>
</html>
