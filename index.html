<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
  /* ---------- SETTINGS: edit these ---------- */
  :root {
    --video-dim: 0.2;           /* 0 = no dimming, higher = darker (1 = black) */
    --button-font-size: 1.5rem;
    --button-color: #ffffff;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  /* ------------------------------------------ */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: var(--font);
  }

  .split {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  .half {
    position: relative;
    flex: 1 1 50%;
    overflow: hidden;
    background: #1a1a1a; /* shows until a video loads */
  }

  .half video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;               /* crops to fill the whole half */
  }

  /* Dimming layer over the video (replaces the CSS filter) */
  .half::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, var(--video-dim));
    pointer-events: none;
  }

  /* Hide native play-button overlays (Safari/Chrome) */
  .half video::-webkit-media-controls,
  .half video::-webkit-media-controls-start-playback-button,
  .half video::-webkit-media-controls-overlay-play-button {
    display: none !important;
    -webkit-appearance: none;
  }

  .half a {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 1rem 2.25rem;
    border: 2px solid var(--button-color);
    color: var(--button-color);
    font-size: var(--button-font-size);
    letter-spacing: 0.04em;
    text-decoration: none;
    white-space: nowrap;
    z-index: 1;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .half a:hover,
  .half a:focus-visible {
    background: var(--button-color);
    color: #111;
    outline: none;
  }

  .half a:focus-visible {
    outline: 3px solid var(--button-color);
    outline-offset: 4px;
  }
</style>
</head>
<body>
  <main class="split">

    <!-- LEFT HALF -->
    <section class="half">
      <video autoplay muted loop playsinline preload="auto">
        <source src="videos/left.mp4" type="video/mp4">
      </video>
      <a href="shorts-music-videos.html">shorts &amp; music videos</a>
    </section>

    <!-- RIGHT HALF -->
    <section class="half">
      <video autoplay muted loop playsinline preload="auto">
        <source src="videos/right.mp4" type="video/mp4">
      </video>
      <a href="content.html">content</a>
    </section>

  </main>

  <script src="site.js"></script>

  <script>
    const videos = document.querySelectorAll('.half video');

    // Safari wants these set as attributes AND properties
    videos.forEach(v => {
      v.setAttribute('muted', '');
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      v.setAttribute('disablepictureinpicture', '');
      v.muted = true;
      v.defaultMuted = true;
      v.controls = false;
    });

    function tryPlay(v) {
      if (!v.paused) return;
      v.muted = true;
      const p = v.play();
      if (p && p.catch) p.catch(() => {});
    }

    function startAll() { videos.forEach(tryPlay); }

    // Try as early and as often as possible
    startAll();
    videos.forEach(v => {
      ['loadedmetadata', 'loadeddata', 'canplay'].forEach(evt =>
        v.addEventListener(evt, () => tryPlay(v))
      );
    });
    window.addEventListener('load', startAll);
    window.addEventListener('pageshow', startAll);
    document.addEventListener('visibilitychange', startAll);

    // Keep retrying briefly in case Safari is slow to allow it
    let tries = 0;
    const retry = setInterval(() => {
      startAll();
      if (++tries > 20 || [...videos].every(v => !v.paused)) clearInterval(retry);
    }, 500);

    // Last resort: first click, tap or key press anywhere starts both
    ['click', 'keydown', 'touchstart', 'pointerdown', 'scroll', 'mousemove'].forEach(evt =>
      document.addEventListener(evt, startAll, { once: true, passive: true })
    );
  </script>
</body>
</html>
